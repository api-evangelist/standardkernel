name: Standardkernel
description: Standard Kernel Co. is an AI infrastructure company that automatically generates high-performance
  compute kernels for GPUs and TPUs. It targets the traditionally manual, expertise-intensive process
  of writing optimized low-level accelerator code, operating at the CUDA and PTX level to fully exploit
  new hardware features rather than relying on higher-level abstractions, delivering better performance
  on compute-bound machine-learning workloads and newer accelerator architectures. Surfaced as a portfolio
  company of Felicis and added to the API Evangelist network; the company is early-stage and publishes
  no public API, developer portal, or specification at this time.
